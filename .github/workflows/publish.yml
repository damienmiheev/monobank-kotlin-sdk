name: Publish to Maven Central

# Manual only. Run it on a release tag (vX.Y.Z) after RELEASING.md's checklist is done.
# It uploads a deployment to the Central Portal; the release becomes public only after
# someone presses "Publish" in https://central.sonatype.com/publishing/deployments.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "sdk = all io.github.damienmiheev modules; relocation = the app.spilki relocation POM"
        required: true
        default: sdk
        type: choice
        options: [sdk, relocation]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            11
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Refuse anything but a release tag matching the version
        run: |
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          case "$version" in *SNAPSHOT*) echo "VERSION_NAME is a snapshot: $version"; exit 1;; esac
          if [ "${GITHUB_REF}" != "refs/tags/v${version}" ]; then
            echo "Run this workflow on tag v${version} (got ${GITHUB_REF})"; exit 1
          fi

      - name: Refuse to run without credentials or signing key
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          for name in OSSRH_USERNAME OSSRH_PASSWORD GPG_SIGNING_KEY GPG_SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Secret $name is not set"; exit 1; fi
          done

      - name: Full check
        run: ./gradlew check --console=plain

      - name: Upload to the Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = "relocation" ]; then
            ./gradlew :relocation:publishToMavenCentral --no-configuration-cache --console=plain
          else
            ./gradlew publishToMavenCentral -x :relocation:publishToMavenCentral --no-configuration-cache --console=plain
          fi

name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste tokens, keys, card data or full webhook bodies with personal data. Security issues: see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: SDK version and module
      placeholder: "io.github.damienmiheev:monobank-acquiring:1.0.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Java/Kotlin version and framework
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Include the endpoint, the exception (class, statusCode, errorCode) and a minimal reproduction.
    validations:
      required: true

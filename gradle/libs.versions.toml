[versions]
kotlin = "2.4.21"
# Latest Jackson 2.x, but the SDK only uses APIs present in 2.13
# (Kill Bill's parent POM pins 2.13.4). The testJackson213 task proves it.
jackson = "2.23.0"
jackson-min = "2.13.4"
jackson-databind-min = "2.13.4.2"
slf4j = "2.0.20"
bouncycastle = "1.87"
detekt = "2.0.0-alpha.6"
ktlint-plugin = "14.2.0"
ktlint-engine = "1.8.0"
dokka = "2.3.0"
maven-publish = "0.37.0"
bcv = "0.18.2"
junit5 = "5.14.4"
mockwebserver = "4.12.0"
assertj = "3.27.7"

[libraries]
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[bundles]
test = ["junit-jupiter", "junit-jupiter-params", "assertj-core", "mockwebserver", "slf4j-simple"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
bcv = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }

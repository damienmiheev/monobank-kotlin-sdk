config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    allowedLines: 40
    excludes: ['**/src/test/**']
  LongParameterList:
    # Response models mirror monobank's JSON one-to-one and have many fields.
    active: false
  TooManyFunctions:
    allowedFunctionsPerFile: 25
    allowedFunctionsPerClass: 25

style:
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: true
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
  ThrowsCount:
    max: 4

exceptions:
  TooGenericExceptionCaught:
    active: false
